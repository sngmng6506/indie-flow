<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>출발 위치와 걷는 시간</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:3px solid #111;outline-offset:2px}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 560px; box-sizing: border-box; background: #6F6F6C; color: {{ink}}; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 16px; line-height: 1.5; word-break: keep-all; display: flex; flex-direction: column; padding: 0 20px 24px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: 0.2; mix-blend-mode: multiply; background-image: url(&quot;data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E&quot;); background-size: 160px 160px"></div>
<div style="flex: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px; color: #FFFFFF; font-size: 14px">목록 화면 위에 올라오는 시트</div>
<div role="dialog" aria-label="출발 위치와 걷는 시간" style="position: relative; margin: 0 -20px -24px; padding: 20px 20px 24px; background: {{paper}}; border-top: 4px solid {{ink}}">
<h2 style="margin: 0 0 10px; font-size: 18px; font-weight: 700">어디서 출발하나요?</h2>
<div role="radiogroup" aria-label="출발 위치">
<button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 6px 0; border: 0; border-top: 2px solid {{ink}}; background: transparent; color: {{ink}}; font: inherit; font-size: 16px; font-weight: 700; text-align: left"><span aria-hidden="true" style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border: 2px solid {{ink}}; border-radius: 50%; background: radial-gradient(circle, #111 0 5px, transparent 6px)"></span><span>홍대입구역</span></button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 6px 0; border: 0; border-top: 2px solid {{ink}}; background: transparent; color: {{ink}}; font: inherit; font-size: 16px; font-weight: 500; text-align: left"><span aria-hidden="true" style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border: 2px solid {{ink}}; border-radius: 50%; background: transparent"></span><span>내 위치<span style="display: block; font-size: 14px; color: #4A4A4A">휴대폰이 위치를 써도 되는지 물어봐요</span></span></button>
</div>
<h2 style="margin: 20px 0 10px; padding-top: 16px; border-top: 2px solid {{ink}}; font-size: 18px; font-weight: 700">얼마나 걸을 수 있나요?</h2>
<div role="radiogroup" aria-label="걷는 시간" style="display: flex; border: 2px solid {{ink}}">
<button type="button" role="radio" aria-checked="false" style="flex: 1; min-height: 48px; border: 0; background: #FAFAF8; color: {{ink}}; font: inherit; font-size: 16px; font-weight: 700">10분</button>
<button type="button" role="radio" aria-checked="true" style="flex: 1; min-height: 48px; border: 0; border-left: 2px solid {{ink}}; background: {{ink}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">15분</button>
<button type="button" role="radio" aria-checked="false" style="flex: 1; min-height: 48px; border: 0; border-left: 2px solid {{ink}}; background: #FAFAF8; color: {{ink}}; font: inherit; font-size: 16px; font-weight: 700">20분</button>
<button type="button" role="radio" aria-checked="false" style="flex: 1; min-height: 48px; border: 0; border-left: 2px solid {{ink}}; background: #FAFAF8; color: {{ink}}; font: inherit; font-size: 16px; font-weight: 700">30분</button>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 14px">
<button type="button" style="min-height: 44px; padding: 0 2px; border: 0; background: transparent; color: {{ink}}; font: inherit; font-size: 15px; text-decoration: underline; text-underline-offset: 3px">거리 상관없이 전체 보기</button>
<button type="button" style="min-height: 44px; padding: 0 2px; border: 0; background: transparent; color: {{ink}}; font: inherit; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; font-weight: 700">닫기</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink":{"editor":"color","default":"#111111"},"paper":{"editor":"color","default":"#ECEBE7"},"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { ink: this.props.ink ?? '#111111', paper: this.props.paper ?? '#ECEBE7' };
}
}
</script>
</body>
</html>
